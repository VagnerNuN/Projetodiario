name: Briefing diário

on:
  schedule:
    # Horários em UTC. Porto Velho = UTC-4.
    - cron: "30 10 * * *"  # 06:30 em Porto Velho: pega a edição do dia (sai na noite anterior)
    - cron: "30 22 * * *"  # 18:30 em Porto Velho: pega edições extras do dia
    - cron: "30 1 * * *"   # 21:30 em Porto Velho: adianta a edição de amanhã
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar, extrair e resumir
        id: robo
        run: python robo/briefing.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELO: ${{ vars.MODELO }}

      - name: Publicar dados no painel
        if: always()
        run: |
          git config user.name "robo-briefing"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Briefing $(TZ=America/Porto_Velho date '+%Y-%m-%d %H:%M')"
            git push
          fi
